name: CI/CD Human Error Reduction Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: cicd-human-error-app
  # Public port is now owned by nginx (blue/green router on the EC2 host),
  # not mapped directly to a container — see terraform/main.tf.
  APP_PORT: 8081
  APP_SHA: ${{ github.sha }}

jobs:
  test-scan-build-deploy:
    name: Test, Scan, Build, and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        working-directory: app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        working-directory: app
        run: pytest -v

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: 'app'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          ignore-unfixed: true

      - name: Build Docker Image
        working-directory: app
        run: docker build -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:latest .

      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGE_NAME }}:${{ github.sha }}'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
          ignore-unfixed: true

      - name: Save Docker Image Artifact
        run: docker save $IMAGE_NAME:${{ github.sha }} -o app-image.tar

      - name: Copy Docker Image to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: app-image.tar
          target: /home/ubuntu

      # Everything below is one remote script, not several steps, because
      # the color decision (blue vs green) has to be made and acted on in
      # the same shell that can see the current nginx symlink — splitting
      # it across GitHub Actions steps would mean re-discovering that
      # state over SSH more than once, with a race between the checks.
      #
      # The flow: load the new image, deploy it ONLY to whichever color
      # isn't currently live, validate it directly on its internal port
      # (production traffic untouched so far), promote by flipping the
      # nginx symlink, re-validate against the real public port, and roll
      # straight back to the previous color if that last check fails.
      - name: Deploy (staging validate -> promote -> verify -> rollback)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_NAME,APP_SHA
          script: |
            set -e
            APP_VERSION=$(echo "$APP_SHA" | cut -c1-7)

            docker load -i /home/ubuntu/app-image.tar

            CURRENT_FILE=$(readlink /etc/nginx/active/current.conf)
            CURRENT=$(basename "$CURRENT_FILE" .conf)
            if [ "$CURRENT" = "blue" ]; then
              NEW_COLOR=green; NEW_PORT=8092
            else
              NEW_COLOR=blue; NEW_PORT=8091
            fi
            echo "Live color: $CURRENT. Deploying $NEW_COLOR ($APP_VERSION) to port $NEW_PORT, production untouched so far."

            docker stop app-$NEW_COLOR 2>/dev/null || true
            docker rm app-$NEW_COLOR 2>/dev/null || true
            docker run -d \
              --name app-$NEW_COLOR \
              --restart unless-stopped \
              -p $NEW_PORT:5000 \
              -e DEPLOY_COLOR=$NEW_COLOR \
              -e APP_VERSION=$APP_VERSION \
              $IMAGE_NAME:$APP_SHA

            echo "Staging validation on internal port $NEW_PORT (not yet public)..."
            STAGING_OK=""
            for i in 1 2 3 4 5; do
              if RESP=$(curl -sf http://127.0.0.1:$NEW_PORT/health); then STAGING_OK=1; break; fi
              echo "  not ready yet (attempt $i/5)"; sleep 3
            done
            if [ -z "$STAGING_OK" ]; then
              echo "STAGING VALIDATION FAILED: $NEW_COLOR never became healthy. Production ($CURRENT) was never touched."
              exit 1
            fi
            GOT_COLOR=$(echo "$RESP" | jq -r .color)
            if [ "$GOT_COLOR" != "$NEW_COLOR" ]; then
              echo "STAGING VALIDATION FAILED: expected color '$NEW_COLOR', health endpoint reported '$GOT_COLOR'."
              exit 1
            fi
            echo "Staging validation passed: $RESP"

            echo "Promoting $NEW_COLOR to live traffic (nginx symlink swap + reload)..."
            ln -sf /etc/nginx/upstreams/$NEW_COLOR.conf /etc/nginx/active/current.conf
            sudo nginx -s reload
            sleep 2

            echo "Post-promotion validation against the real public endpoint..."
            PUBLIC_OK=""
            for i in 1 2 3; do
              if PUB=$(curl -sf http://127.0.0.1:8081/health); then PUBLIC_OK=1; break; fi
              sleep 2
            done
            PUB_COLOR=$(echo "$PUB" | jq -r .color 2>/dev/null || echo "")
            if [ -n "$PUBLIC_OK" ] && [ "$PUB_COLOR" = "$NEW_COLOR" ]; then
              echo "Promotion verified live: $PUB"
            else
              echo "POST-PROMOTION CHECK FAILED (got: '$PUB') — rolling back to $CURRENT automatically."
              ln -sf /etc/nginx/upstreams/$CURRENT.conf /etc/nginx/active/current.conf
              sudo nginx -s reload
              echo "Rolled back: $CURRENT is live again. Failing this workflow run so it's visible, not silently green."
              exit 1
            fi
